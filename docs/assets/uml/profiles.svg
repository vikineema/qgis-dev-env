<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="469px" preserveAspectRatio="none" style="width:825px;height:469px;background:#FFFFFF;" version="1.1" viewBox="0 0 825 469" width="825px" zoomAndPan="magnify"><title>State &#8212; build profiles (qgis-dev profile &lt;name&gt;)</title><defs/><g><g class="title" data-source-line="12"><text fill="#000000" font-family="sans" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="360.7939" x="225.2001" y="22.9951">State &#8212; build profiles (qgis-dev profile &lt;name&gt;)</text></g><g id="debug"><rect fill="#F5F5F2" height="64.2344" rx="12.5" ry="12.5" style="stroke:#54A2CC;stroke-width:0.5;" width="200.9727" x="256.64" y="140.2969"/><line style="stroke:#54A2CC;stroke-width:0.5;" x1="256.64" x2="457.6127" y1="166.5938" y2="166.5938"/><text fill="#383939" font-family="sans" font-size="14" lengthAdjust="spacing" textLength="44.1465" x="335.0531" y="158.292">debug</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="140.3379" x="261.64" y="182.7324">full features (3D, PDAL,</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="180.9727" x="261.64" y="196.7012">WebEngine, tests); split-dwarf</text></g><g id="minimal"><rect fill="#F5F5F2" height="64.2344" rx="12.5" ry="12.5" style="stroke:#54A2CC;stroke-width:0.5;" width="191.8906" x="14.18" y="281.5369"/><line style="stroke:#54A2CC;stroke-width:0.5;" x1="14.18" x2="206.0706" y1="307.8338" y2="307.8338"/><text fill="#383939" font-family="sans" font-size="14" lengthAdjust="spacing" textLength="56.3965" x="81.9271" y="299.532">minimal</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="128.3672" x="19.18" y="323.9724">3D/PDAL/WebEngine/</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="171.8906" x="19.18" y="337.9412">bindings/tests OFF &#8212; fastest</text></g><g id="release"><rect fill="#F5F5F2" height="64.2344" rx="12.5" ry="12.5" style="stroke:#54A2CC;stroke-width:0.5;" width="129.3301" x="276.46" y="281.5369"/><line style="stroke:#54A2CC;stroke-width:0.5;" x1="276.46" x2="405.7901" y1="307.8338" y2="307.8338"/><text fill="#383939" font-family="sans" font-size="14" lengthAdjust="spacing" textLength="51.3584" x="315.4458" y="299.532">release</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="109.3301" x="281.46" y="323.9724">RelWithDebInfo &#8212;</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="69.6563" x="281.46" y="337.9412">for profiling</text></g><g id="asan"><rect fill="#F5F5F2" height="64.2344" rx="12.5" ry="12.5" style="stroke:#54A2CC;stroke-width:0.5;" width="137.2637" x="597.5" y="281.5369"/><line style="stroke:#54A2CC;stroke-width:0.5;" x1="597.5" x2="734.7637" y1="307.8338" y2="307.8338"/><text fill="#383939" font-family="sans" font-size="14" lengthAdjust="spacing" textLength="80.8828" x="625.6904" y="299.532">asan-ubsan</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="83.502" x="602.5" y="323.9724">sanitizers ON,</text><text fill="#383939" font-family="sans" font-size="12" lengthAdjust="spacing" textLength="117.2637" x="602.5" y="337.9412">heavy features OFF</text></g><ellipse cx="357.13" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="29" data-uid="ent0003" id="entity_GMN2"><path d="M544.18,406.7669 L544.18,462.1653 A0,0 0 0 0 544.18,462.1653 L788.0716,462.1653 A0,0 0 0 0 788.0716,462.1653 L788.0716,416.7669 L778.0716,406.7669 L670.13,406.7669 L666.13,346.1769 L662.13,406.7669 L544.18,406.7669 A0,0 0 0 0 544.18,406.7669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M778.0716,406.7669 L778.0716,41