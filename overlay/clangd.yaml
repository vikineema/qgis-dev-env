#
# Symlinked into the QGIS checkout as .clangd (SRS FR-L1). The compilation
# database comes from qgis-dev configure (CMAKE_EXPORT_COMPILE_COMMANDS=ON);
# `build` is relative, so each worktree finds its own database.
CompileFlags:
  CompilationDatabase: build
  Remove:
    - -fanalyzer
    - -mno-direct-extern-access
Index:
  Background: Build
Diagnostics:
  ClangTidy:
    # QGIS's .clang-tidy sets ClassMemberCase (static members) to CamelCase
    # with an `s` prefix, but QGIS's own static "settings" entries use
    # camelBack (leading lowercase, e.g. `settingsShowInstallFromZipWarning`).
    # That mismatch makes clangd flag QGIS's own compliant members. Accept
    # camelBack for static members (no forced prefix) to match real QGIS
    # convention. Local editor tweak only — upstream .clang-tidy untouched.
    CheckOptions:
      readability-identifier-naming.ClassMemberCase: camelBack
      readability-identifier-naming.ClassMemberPrefix: ""
---
# Generated code (moc/uic/SIP output under build/) — parse, don't nag.
If:
  PathMatch: build/.*
Diagnostics:
  Suppress: "*"
