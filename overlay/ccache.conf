#
# Shared ccache configuration for QGIS development (SRS FR-B2).
# The cache directory is set via CCACHE_DIR in overlay/envrc (XDG cache,
# shared across every checkout and worktree). Build profiles are separated
# with CCACHE_NAMESPACE by qgis-dev, so Debug and ASan objects never mix.
max_size = 50G
compression = true
sloppiness = pch_defines,time_macros,include_file_ctime,include_file_mtime
